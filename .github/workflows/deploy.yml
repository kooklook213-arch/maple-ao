name: Deploy to GitHub Pages

on:
  push:
    branches: [main]        # <-- rename this if your default branch differs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-ai/package-lock.json

      - name: Install & build
        run: |
          cd portfolio-ai
          npm ci
          npm run build   # vite build auto-derives /<repo>/ base + injects SITE_TITLE
        env:
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          REACT_APP_GOOGLE_SCRIPT_URL: ${{ vars.GOOGLE_SCRIPT_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-ai/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
